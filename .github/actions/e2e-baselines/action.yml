name: Fetch E2E release baselines
description: Supply missing release tags from a fork's parent in the disposable checkout.
inputs:
  install-ref:
    description: Exact baseline needed by a matrix leg; empty discovers stable releases.
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASELINE_REF: ${{ inputs.install-ref }}
      run: bash "$GITHUB_ACTION_PATH/fetch.sh"

